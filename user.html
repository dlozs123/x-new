<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推文归档</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #e8e8e8;
    --surface: #f4f4f4;
    --surface2: #ebebeb;
    --border: #d0d0d0;
    --border2: #b8b8b8;
    --text: #1a1a1a;
    --text-muted: #666666;
    --text-dim: #999999;
    --accent: #3a78d4;
    --accent-hover: #2260b8;
    --accent2: #7c5cbf;
    --red: #d93025;
    --green: #1a8a5a;
    --orange: #e07b20;
    --sidebar-w: 220px;
    --header-h: 60px;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .site-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 200;
    height: var(--header-h);
    background: rgba(232,232,232,0.92);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 20px;
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-muted);
    text-decoration: none;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .back-btn:hover { color: var(--text); }
  .back-btn svg { width: 16px; height: 16px; }

  .header-user {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .header-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    border: 1px solid var(--border2);
  }
  .header-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .header-name {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-count {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  /* ── LAYOUT ── */
  .layout {
    display: flex;
    padding-top: var(--header-h);
    min-height: 100vh;
    justify-content: center;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    position: fixed;
    top: var(--header-h);
    left: 0;
    bottom: 0;
    overflow-y: auto;
    border-right: 1px solid var(--border);
    background: var(--surface);
    padding: 20px 0 40px;
    scrollbar-width: thin;
    scrollbar-color: var(--border2) transparent;
    transition: left 0.25s ease, box-shadow 0.25s ease;
    z-index: 100;
  }
  .sidebar.collapsed { left: calc(-1 * var(--sidebar-w)); box-shadow: none; }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* Sidebar toggle button - sits on right edge of sidebar */
  .sidebar-collapse-btn {
    position: fixed;
    top: calc(var(--header-h) + 16px);
    left: calc(var(--sidebar-w) - 1px);
    z-index: 101;
    width: 22px;
    height: 44px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: none;
    border-radius: 0 8px 8px 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    transition: left 0.25s ease, background 0.15s, color 0.15s;
    padding: 0;
  }
  .sidebar-collapse-btn:hover { background: var(--surface2); color: var(--accent); }
  .sidebar-collapse-btn svg {
    width: 12px;
    height: 12px;
    transition: transform 0.25s ease;
    flex-shrink: 0;
  }
  .sidebar-collapse-btn.collapsed {
    left: 0;
    border-left: 1px solid var(--border);
    border-radius: 0 8px 8px 0;
  }
  .sidebar-collapse-btn.collapsed svg { transform: rotate(180deg); }

  .sidebar-title {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 0 16px 12px;
  }

  .tree-year {
    border-bottom: 1px solid var(--border);
  }

  .tree-btn {
    display: flex;
    align-items: center;
    width: 100%;
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    padding: 9px 16px;
    font-family: inherit;
    font-size: 13px;
    transition: background 0.15s, color 0.15s;
    text-align: left;
    gap: 8px;
  }
  .tree-btn:hover { background: var(--surface2); color: var(--accent); }

  .tree-btn.year-btn { font-weight: 700; font-size: 14px; }
  .tree-btn.month-btn { padding-left: 30px; font-size: 13px; color: var(--text-muted); }
  .tree-btn.day-btn { padding-left: 46px; font-size: 12px; color: var(--text-dim); }
  .tree-btn.day-btn:hover { color: var(--accent); }

  .tree-arrow {
    margin-left: auto;
    font-size: 10px;
    transition: transform 0.2s;
    opacity: 0.5;
    flex-shrink: 0;
  }
  .tree-btn[aria-expanded="true"] .tree-arrow { transform: rotate(90deg); }

  .tree-children { display: none; }
  .tree-children.open { display: block; }

  .tree-count {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-left: auto;
  }

  /* ── MAIN FEED ── */
  .feed-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    min-width: 0;
  }

  .feed {
    width: 100%;
    max-width: 620px;
    padding: 20px 0 80px;
    min-width: 0;
  }

  /* ── TWEET CARD ── */
  .tweet {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 8px 12px;
    padding: 16px 20px;
    transition: box-shadow 0.15s;
  }
  .tweet:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

  .tweet-inner {
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }

  /* Avatar */
  .tweet-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    border: 1px solid var(--border);
    cursor: pointer;
    position: relative;
  }
  .tweet-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tweet-avatar .av-fallback {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
  }

  /* Gradient classes (shared with index) */
  .grad-0 { background: linear-gradient(135deg, #667eea, #764ba2); }
  .grad-1 { background: linear-gradient(135deg, #f093fb, #f5576c); }
  .grad-2 { background: linear-gradient(135deg, #4facfe, #00f2fe); }
  .grad-3 { background: linear-gradient(135deg, #43e97b, #38f9d7); }
  .grad-4 { background: linear-gradient(135deg, #fa709a, #fee140); }
  .grad-5 { background: linear-gradient(135deg, #a18cd1, #fbc2eb); }
  .grad-6 { background: linear-gradient(135deg, #ffecd2, #fcb69f); }
  .grad-7 { background: linear-gradient(135deg, #96fbc4, #f9f586); }

  /* Body */
  .tweet-body { flex: 1; min-width: 0; }

  .tweet-meta {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }

  .tweet-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 200px;
  }

  .tweet-handle {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .tweet-time {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-left: auto;
    white-space: nowrap;
  }

  .tweet-text {
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 14px;
    word-break: break-word;
    overflow-wrap: break-word;
  }

  .tweet-text a {
    color: var(--accent);
    text-decoration: none;
  }
  .tweet-text a:hover { text-decoration: underline; color: var(--accent-hover); }
  .tweet-text .orig-link {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* Media - full width of tweet, outside avatar indent */
  .tweet-media {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 10px 0 10px 0;
    border-radius: 10px;
    overflow: hidden;
  }

  .media-item {
    position: relative;
    width: 100%;
    cursor: pointer;
    background: var(--surface2);
    overflow: hidden;
    border-radius: 8px;
  }

  .media-item img {
    width: 100%;
    height: auto;
    display: block;
    transition: opacity 0.3s;
  }

  .media-item img[data-src]:not([src]) { min-height: 200px; }

  .media-item .play-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.35);
  }

  .play-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    transition: background 0.15s, transform 0.15s;
  }

  .media-item:hover .play-btn {
    background: rgba(255,255,255,0.25);
    transform: scale(1.08);
  }

  .play-btn svg { width: 22px; height: 22px; fill: white; margin-left: 3px; }

  /* Video canvas thumbnail */
  .media-item canvas {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Actions */
  .tweet-actions {
    display: flex;
    gap: 0;
    margin-top: 4px;
    padding: 4px 4px 2px;
  }

  .action-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-dim);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    padding: 6px 18px 6px 0;
    border-radius: 6px;
    transition: color 0.15s;
    user-select: none;
    flex: 1;
  }

  .action-btn svg { width: 18px; height: 18px; transition: transform 0.15s; }
  .action-btn:hover { color: var(--accent); }
  .action-btn:hover svg { transform: scale(1.15); }

  .action-btn.reply:hover { color: var(--accent); }
  .action-btn.retweet:hover { color: var(--green); }
  .action-btn.like:hover { color: var(--red); }
  .action-btn.bookmark:hover { color: var(--accent2); }

  .action-btn.active.reply { color: var(--accent); }
  .action-btn.active.retweet { color: var(--green); }
  .action-btn.active.like { color: var(--red); }
  .action-btn.active.bookmark { color: var(--accent2); }

  .action-btn.active svg { fill: currentColor; }
  .action-btn.like.active svg { animation: heartPop 0.3s ease; }
  @keyframes heartPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  /* date anchor */
  .date-anchor { 
    display: block; 
    height: 0; 
    visibility: hidden;
    pointer-events: none;
  }

  /* ── LOADING ── */
  .loading-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 500;
    gap: 20px;
  }

  .loading-spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ── MODAL ── */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }
  .modal.open { display: flex; }

  .modal-media {
    max-height: 100vh;
    max-width: 100vw;
    height: 100vh;
    width: auto;
    object-fit: contain;
    cursor: default;
    display: block;
  }

  .modal-video {
    max-height: 100vh;
    max-width: 100vw;
    width: auto;
    height: 100vh;
    object-fit: contain;
    cursor: default;
    display: block;
  }

  .modal-close {
    position: fixed;
    top: 20px;
    right: 24px;
    width: 40px;
    height: 40px;
    background: rgba(255,255,255,0.1);
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    z-index: 1001;
  }
  .modal-close:hover { background: rgba(255,255,255,0.2); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 80px 24px;
    color: var(--text-muted);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .sidebar { left: calc(-1 * var(--sidebar-w)); }
    .sidebar.collapsed { left: calc(-1 * var(--sidebar-w)); }
    .sidebar.mobile-open { left: 0; }
    .sidebar-collapse-btn { display: none; }
    .feed { max-width: 100%; padding: 20px 0 80px; }
    .sidebar-toggle { display: flex !important; }
  }

  .sidebar-toggle {
    display: none;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    background: none;
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--text-muted);
    cursor: pointer;
    margin-left: auto;
  }
</style>
</head>
<body>

<!-- Loading -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">正在加载数据...</div>
</div>

<!-- Header -->
<header class="site-header">
  <a href="index.html" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    归档首页
  </a>
  <div class="header-user" id="headerUser"></div>
  <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
</header>

<!-- Layout -->
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">时间线导航</div>
    <div id="sidebarTree"></div>
  </aside>
  <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="收起侧边栏">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>
  <div class="feed-wrapper">
    <main class="feed" id="feed"></main>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
  <button class="modal-close" id="modalCloseBtn">✕</button>
  <div id="modalContent"></div>
</div>

<script src="userData.js"></script>
<script>
const API_BASE = 'https://e.flan.uno';
const AVATAR_BASE = 'https://r4.flan.uno/images';
const MEDIA_BASE = 'https://r3.flan.uno';

const AVATAR_GRADS = ['grad-0','grad-1','grad-2','grad-3','grad-4','grad-5','grad-6','grad-7'];

function hashStr(s) {
  let h = 0;
  for (const c of s) h = (h * 31 + c.charCodeAt(0)) & 0xffffffff;
  return Math.abs(h);
}

function getInitial(name) {
  const clean = (name || '').replace(/[\u{1F300}-\u{1FFFF}]/gu, '').trim();
  return clean[0] || '?';
}

function makeAvatar(screenName, name) {
  const wrap = document.createElement('div');
  wrap.className = 'tweet-avatar';
  wrap.title = name;

  const img = document.createElement('img');
  img.alt = name;
  img.style.display = 'block';

  const gradClass = AVATAR_GRADS[hashStr(screenName) % AVATAR_GRADS.length];
  const fallback = document.createElement('div');
  fallback.className = `av-fallback ${gradClass}`;
  fallback.textContent = getInitial(name);

  img.onerror = () => {
    img.style.display = 'none';
    fallback.style.display = 'flex';
  };
  img.src = `${AVATAR_BASE}/${screenName}.jpg`;

  wrap.appendChild(img);
  wrap.appendChild(fallback);
  return wrap;
}

// ── Helpers ──────────────────────────────────────────────

function getParam(key) {
  return new URLSearchParams(window.location.search).get(key);
}

function parseDate(str) {
  // "2018-07-24 18:01:30 +08:00" → "2018-07-24T18:01:30+08:00"
  return new Date(str.trim().replace(' ', 'T').replace(' ', ''));
}

function formatDateStr(str) {
  const d = parseDate(str);
  const y = d.getFullYear();
  const mo = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const h = String(d.getHours()).padStart(2, '0');
  const m = String(d.getMinutes()).padStart(2, '0');
  return `${y}/${mo}/${day} ${h}:${m}`;
}

function dateKey(str) {
  const d = parseDate(str);
  return {
    year: d.getFullYear(),
    month: d.getMonth() + 1,
    day: d.getDate()
  };
}

function compactDate(str) {
  const d = parseDate(str);
  const y = d.getFullYear();
  const mo = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}${mo}${day}`;
}

function getMediaExt(media) {
  if (media.type === 'video' || media.type === 'animated_gif') return 'mp4';
  const m = (media.original || '').match(/format=(\w+)/);
  return m ? m[1] : 'jpg';
}

function buildMediaUrl(tweet, mediaIdx) {
  const m = tweet.media[mediaIdx];
  const sn = tweet.screen_name;
  const id = tweet.id;
  const type = m.type;
  const num = mediaIdx + 1;
  const date = compactDate(tweet.created_at);
  const ext = getMediaExt(m);
  return `${MEDIA_BASE}/${sn}_${id}_${type}_${num}_${date}.${ext}`;
}

// ── Text Processing ──────────────────────────────────────

function processTweetText(rawText) {
  const placeholders = [];

  // 1. Find all t.co links; record the last one
  const tcoRe = /https:\/\/t\.co\/[A-Za-z0-9]+/g;
  const allTco = [...rawText.matchAll(tcoRe)];
  const lastTcoUrl = allTco.length > 0 ? allTco[allTco.length - 1][0] : null;

  let text = rawText;

  // 2. Replace "label":[url] custom format
  text = text.replace(/"([^"]+)":\[([^\]]+)\]/g, (_, label, url) => {
    const idx = placeholders.length;
    placeholders.push(`<a href="${url}" target="_blank" rel="noopener">${escHtml(label)}</a>`);
    return `\x00${idx}\x00`;
  });

  // 3. Handle t.co links
  text = text.replace(/https:\/\/t\.co\/[A-Za-z0-9]+/g, (match) => {
    if (match === lastTcoUrl) {
      const idx = placeholders.length;
      placeholders.push(`<a href="${match}" target="_blank" rel="noopener" class="orig-link">原推文</a>`);
      return `\x00${idx}\x00`;
    }
    return ''; // remove other t.co links
  });

  // 4. Escape HTML in remaining text
  text = escHtml(text);

  // 5. Restore placeholders
  text = text.replace(/\x00(\d+)\x00/g, (_, idx) => placeholders[parseInt(idx)]);

  // 6. Newlines
  text = text.replace(/\r\n|\r|\n/g, '<br>');

  // 7. Clean up extra whitespace around removed links
  text = text.replace(/ {2,}/g, ' ').trim();

  return text;
}

function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Data Loading ─────────────────────────────────────────

async function loadAllTweets() {
  setLoading('加载 index.json...');
  const indexRes = await fetch(`${API_BASE}/index.json`);
  const { files } = await indexRes.json();

  setLoading(`加载 ${files.length} 个数据文件...`);
  const results = await Promise.all(
    files.map(f => fetch(`${API_BASE}/${f}`).then(r => r.json()).catch(() => []))
  );
  return results.flat();
}

function setLoading(msg) {
  document.getElementById('loadingText').textContent = msg;
}

function hideLoading() {
  const el = document.getElementById('loadingScreen');
  el.style.opacity = '0';
  el.style.transition = 'opacity 0.4s';
  setTimeout(() => el.remove(), 400);
}

// ── Avatar lazy loading (small images, observer is fine) ─────

const avatarObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const img = entry.target;
      if (img.dataset.src) {
        img.src = img.dataset.src;
        img.removeAttribute('data-src');
        avatarObserver.unobserve(img);
      }
    }
  });
}, { rootMargin: '600px' });

function lazyImg(src, alt, cls) {
  const img = document.createElement('img');
  img.alt = alt || '';
  if (cls) img.className = cls;
  img.dataset.src = src;
  avatarObserver.observe(img);
  return img;
}

// Media images load immediately - no observer, browser starts fetching right away
function directImg(src, alt) {
  const img = document.createElement('img');
  img.alt = alt || '';
  img.src = src;
  img.style.display = 'block';
  img.style.width = '100%';
  img.style.height = 'auto';
  return img;
}

// ── Video Thumbnail ───────────────────────────────────────

function makeVideoThumbnail(videoUrl) {
  const video = document.createElement('video');
  video.src = videoUrl;
  video.preload = 'metadata';
  video.muted = true;
  video.playsInline = true;
  video.style.width = '100%';
  video.style.display = 'block';
  video.style.cursor = 'pointer';
  // Seek to first frame once metadata loads
  video.addEventListener('loadedmetadata', () => { video.currentTime = 0.01; });
  return video;
}

// ── Modal ─────────────────────────────────────────────────

function openImageModal(src) {
  const mc = document.getElementById('modalContent');
  mc.innerHTML = '';
  const img = document.createElement('img');
  img.className = 'modal-media';
  img.src = src;
  mc.appendChild(img);
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openVideoModal(src) {
  const mc = document.getElementById('modalContent');
  mc.innerHTML = '';
  const video = document.createElement('video');
  video.className = 'modal-video';
  video.src = src;
  video.controls = true;
  video.autoplay = true;
  mc.appendChild(video);
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  const modal = document.getElementById('modal');
  modal.classList.remove('open');
  document.body.style.overflow = '';
  const vid = modal.querySelector('video');
  if (vid) { vid.pause(); vid.src = ''; }
  document.getElementById('modalContent').innerHTML = '';
}

// Close modal when clicking background (not media)
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

// ── Tweet Rendering ───────────────────────────────────────

function createTweetEl(tweet, dateAnchors) {
  const { year, month, day } = dateKey(tweet.created_at);
  const container = document.createElement('article');
  container.className = 'tweet';
  container.dataset.year = year;
  container.dataset.month = month;
  container.dataset.day = day;
  container.dataset.id = tweet.id;

  const inner = document.createElement('div');
  inner.className = 'tweet-inner';

  // Avatar
  const avatarDiv = makeAvatar(tweet.screen_name, tweet.name);

  // Body
  const body = document.createElement('div');
  body.className = 'tweet-body';

  // Meta
  const meta = document.createElement('div');
  meta.className = 'tweet-meta';

  const nameEl = document.createElement('span');
  nameEl.className = 'tweet-name';
  nameEl.title = tweet.name;
  nameEl.textContent = tweet.name;

  const handleEl = document.createElement('a');
  handleEl.className = 'tweet-handle';
  handleEl.href = `https://x.com/${tweet.screen_name}`;
  handleEl.target = '_blank';
  handleEl.rel = 'noopener noreferrer';
  handleEl.textContent = `@${tweet.screen_name}`;

  const timeEl = document.createElement('span');
  timeEl.className = 'tweet-time';
  timeEl.title = tweet.created_at;
  timeEl.textContent = formatDateStr(tweet.created_at);

  meta.appendChild(nameEl);
  meta.appendChild(handleEl);
  meta.appendChild(timeEl);

  // Text
  const textEl = document.createElement('div');
  textEl.className = 'tweet-text';
  const processed = processTweetText(tweet.full_text || '');
  if (processed) textEl.innerHTML = processed;

  body.appendChild(meta);
  if (processed) body.appendChild(textEl);

  inner.appendChild(avatarDiv);
  inner.appendChild(body);
  container.appendChild(inner);

  // Media appended to container (full tweet width), outside avatar indent
  if (tweet.media && tweet.media.length > 0) {
    const mediaWrap = document.createElement('div');
    mediaWrap.className = 'tweet-media';

    tweet.media.forEach((m, idx) => {
      const mediaUrl = buildMediaUrl(tweet, idx);
      const isVideo = m.type === 'video' || m.type === 'animated_gif';

      const item = document.createElement('div');
      item.className = 'media-item';

      if (isVideo) {
        const thumb = makeVideoThumbnail(mediaUrl);
        item.appendChild(thumb);
        const overlay = document.createElement('div');
        overlay.className = 'play-overlay';
        overlay.innerHTML = `<div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>`;
        item.appendChild(overlay);
        item.addEventListener('click', () => openVideoModal(mediaUrl));
      } else {
        const img = directImg(mediaUrl, `媒体 ${idx + 1}`);
        item.appendChild(img);
        item.addEventListener('click', () => openImageModal(mediaUrl));
      }

      mediaWrap.appendChild(item);
    });

    container.appendChild(mediaWrap);
  }

  // Actions after media
  const actions = document.createElement('div');
  actions.className = 'tweet-actions';

  const actionDefs = [
    {
      cls: 'reply',
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
      count: tweet.reply_count || 0
    },
    {
      cls: 'retweet',
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`,
      count: tweet.retweet_count || 0
    },
    {
      cls: 'like',
      icon: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
      count: tweet.favorite_count || 0
    },
    {
      cls: 'bookmark',
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`,
      count: tweet.bookmark_count || 0
    }
  ];

  actionDefs.forEach(def => {
    const btn = document.createElement('button');
    btn.className = `action-btn ${def.cls}`;
    let count = def.count;

    const iconWrap = document.createElement('span');
    iconWrap.innerHTML = def.icon;

    const countEl = document.createElement('span');
    countEl.className = 'action-count';
    countEl.textContent = formatCount(count);

    btn.appendChild(iconWrap);
    btn.appendChild(countEl);

    btn.addEventListener('click', () => {
      const isActive = btn.classList.toggle('active');
      count = isActive ? count + 1 : count - 1;
      countEl.textContent = formatCount(count);
    });

    actions.appendChild(btn);
  });

  container.appendChild(actions);

  return container;
}

function formatCount(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return n;
}

// ── Sidebar ───────────────────────────────────────────────

function buildSidebar(tweets) {
  // Build tree: year → month → day → [tweet indices]
  // tweets are sorted newest first, so indexes increase with older tweets
  const tree = {}; // { year: { month: { day: lastTweetIdx } } }

  tweets.forEach((tweet, idx) => {
    const { year, month, day } = dateKey(tweet.created_at);
    if (!tree[year]) tree[year] = {};
    if (!tree[year][month]) tree[year][month] = {};
    // Since tweets are newest→oldest, we overwrite to get the LAST (oldest) tweet for each period
    tree[year][month][day] = idx;
    tree[year][month]._last = idx;
    tree[year]._last = idx;
  });

  const container = document.getElementById('sidebarTree');

  const years = Object.keys(tree).filter(k => k !== '_last').sort((a, b) => b - a);

  years.forEach(year => {
    const yearObj = tree[year];
    const yearDiv = document.createElement('div');
    yearDiv.className = 'tree-year';

    const yearBtn = document.createElement('button');
    yearBtn.className = 'tree-btn year-btn';
    yearBtn.setAttribute('aria-expanded', 'false');
    yearBtn.innerHTML = `${year}年 <span class="tree-arrow">▶</span>`;
    yearBtn.addEventListener('click', () => {
      const expanded = yearBtn.getAttribute('aria-expanded') === 'true';
      yearBtn.setAttribute('aria-expanded', !expanded);
      monthsDiv.classList.toggle('open', !expanded);
      scrollToTweet(yearObj._last);
    });

    const monthsDiv = document.createElement('div');
    monthsDiv.className = 'tree-children';

    const months = Object.keys(yearObj).filter(k => k !== '_last').sort((a, b) => b - a);

    months.forEach(month => {
      const monthObj = yearObj[month];
      const monthDiv = document.createElement('div');

      const monthBtn = document.createElement('button');
      monthBtn.className = 'tree-btn month-btn';
      monthBtn.setAttribute('aria-expanded', 'false');
      const monthNames = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];
      monthBtn.innerHTML = `${monthNames[parseInt(month)-1]}月 <span class="tree-arrow">▶</span>`;
      monthBtn.addEventListener('click', () => {
        const expanded = monthBtn.getAttribute('aria-expanded') === 'true';
        monthBtn.setAttribute('aria-expanded', !expanded);
        daysDiv.classList.toggle('open', !expanded);
        scrollToTweet(monthObj._last);
      });

      const daysDiv = document.createElement('div');
      daysDiv.className = 'tree-children';

      const days = Object.keys(monthObj).filter(k => k !== '_last').sort((a, b) => b - a);

      days.forEach(day => {
        const tweetIdx = monthObj[day];
        const dayBtn = document.createElement('button');
        dayBtn.className = 'tree-btn day-btn';
        dayBtn.textContent = `${parseInt(day)}日`;
        dayBtn.addEventListener('click', () => scrollToTweet(tweetIdx));

        daysDiv.appendChild(dayBtn);
      });

      monthDiv.appendChild(monthBtn);
      monthDiv.appendChild(daysDiv);
      monthsDiv.appendChild(monthDiv);
    });

    yearDiv.appendChild(yearBtn);
    yearDiv.appendChild(monthsDiv);
    container.appendChild(yearDiv);
  });
}

function highlightSidebarDate(dateStr) {
  // dateStr: "20180724"
  const year = dateStr.slice(0, 4);
  const month = parseInt(dateStr.slice(4, 6));
  const day = parseInt(dateStr.slice(6, 8));

  // Find and expand year button
  const yearBtns = document.querySelectorAll('.tree-btn.year-btn');
  yearBtns.forEach(btn => {
    if (btn.textContent.startsWith(year)) {
      if (btn.getAttribute('aria-expanded') !== 'true') btn.click();

      // Find month button inside
      setTimeout(() => {
        const monthNames = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];
        const monthName = monthNames[month - 1] + '月';
        const monthBtns = btn.parentElement.querySelectorAll('.tree-btn.month-btn');
        monthBtns.forEach(mb => {
          if (mb.textContent.trim().startsWith(monthName)) {
            if (mb.getAttribute('aria-expanded') !== 'true') mb.click();

            // Find and highlight day button
            setTimeout(() => {
              const dayBtns = mb.parentElement.querySelectorAll('.tree-btn.day-btn');
              dayBtns.forEach(db => {
                if (db.textContent.trim() === `${day}日`) {
                  db.style.color = 'var(--accent)';
                  db.style.fontWeight = '700';
                  db.style.background = 'rgba(58,120,212,0.10)';
                  db.scrollIntoView({ block: 'nearest' });
                }
              });
            }, 50);
          }
        });
      }, 50);
    }
  });
}

function scrollToTweet(idx) {
  // 先确保目标推文已渲染
  if (window._renderUntil) window._renderUntil(idx);

  const feed = document.getElementById('feed');
  const articles = feed.querySelectorAll('.tweet');
  if (articles[idx]) {
    const headerH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header-h')) || 60;
    const top = articles[idx].getBoundingClientRect().top + window.scrollY - headerH - 12;
    window.scrollTo({ top, behavior: 'smooth' });
    articles[idx].style.background = 'rgba(58,120,212,0.08)';
    setTimeout(() => { articles[idx].style.background = ''; }, 1200);
  }
}

function toggleSidebar() {

// Close mobile sidebar when clicking outside
document.addEventListener('click', (e) => {

// ── Header ────────────────────────────────────────────────

function renderHeader(screenName, tweets) {
  const headerUser = document.getElementById('headerUser');

  // Use the name from the most recent tweet
  const recentName = tweets.length > 0 ? tweets[0].name : screenName;

  const avatarDiv = document.createElement('div');
  avatarDiv.className = 'header-avatar';
  const avatarImg = document.createElement('img');
  avatarImg.src = `${AVATAR_BASE}/${screenName}.jpg`;
  avatarImg.alt = screenName;
  avatarImg.onerror = () => { avatarDiv.style.display = 'none'; };
  avatarDiv.appendChild(avatarImg);

  const nameEl = document.createElement('div');
  nameEl.className = 'header-name';
  nameEl.textContent = recentName;

  const countEl = document.createElement('div');
  countEl.className = 'header-count';
  countEl.textContent = `${tweets.length} tweets · @${screenName}`;

  headerUser.appendChild(avatarDiv);
  headerUser.appendChild(nameEl);
  headerUser.appendChild(countEl);

  document.title = `${recentName} - 推文归档`;
}

// ── Main ──────────────────────────────────────────────────

const BATCH_SIZE = 15;

async function main() {
  const screenName = getParam('user');
  if (!screenName) {
    window.location.href = 'index.html';
    return;
  }

  try {
    const all = await loadAllTweets();
    setLoading('过滤推文...');

    const hasTco = t => /https:\/\/t\.co\/[A-Za-z0-9]+/.test(t.full_text || '');
    const deduped = new Map();
    all.filter(t => t.screen_name === screenName).forEach(t => {
      if (!deduped.has(t.id)) {
        deduped.set(t.id, t);
      } else if (hasTco(t) && !hasTco(deduped.get(t.id))) {
        deduped.set(t.id, t); // 替换为有短链的版本
      }
    });
    const tweets = Array.from(deduped.values())
      .sort((a, b) => parseDate(b.created_at) - parseDate(a.created_at));

    renderHeader(screenName, tweets);

    const feed = document.getElementById('feed');

    if (tweets.length === 0) {
      feed.innerHTML = `<div class="empty-state">没有找到 @${screenName} 的推文</div>`;
      hideLoading();
      return;
    }

    // 分批渲染
    let loadedCount = 0;

    function renderBatch() {
      const batch = tweets.slice(loadedCount, loadedCount + BATCH_SIZE);
      batch.forEach(tweet => feed.appendChild(createTweetEl(tweet)));
      loadedCount += batch.length;
    }

    // 首批渲染
    renderBatch();
    buildSidebar(tweets);
    hideLoading();

    // 搜索跳转高亮：?highlight=YYYYMMDD
    const hlDate = getParam('highlight');
    if (hlDate) highlightSidebarDate(hlDate);

    // 滚动到底部时追加下一批
    window.addEventListener('scroll', () => {
      if (loadedCount >= tweets.length) return;
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 600) {
        renderBatch();
      }
    });

    // 暴露给侧边栏跳转用
    window._tweets = tweets;
    window._renderUntil = (idx) => {
      while (loadedCount <= idx && loadedCount < tweets.length) {
        renderBatch();
      }
    };

  } catch (err) {
    console.error(err);
    setLoading('加载失败：' + err.message);
  }
}

main();
